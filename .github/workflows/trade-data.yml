name: Refresh trade exposure data
# Flaw-three fix: the pipeline runs here in the cloud, never on a laptop.
# Yearly on 15 July (after Comtrade final annual data lands), plus manual runs.
on:
  schedule:
    - cron: "0 6 15 7 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mapping and invariant tests
        run: python pipeline/test_mapping.py
      - name: Run pipeline (live)
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: python pipeline/compute.py --live
      # Note: do NOT run test_mapping.py here. It regenerates sample data into
      # public/data/ (see its final subprocess call), which would overwrite the
      # live output before it is committed. Mapping invariants already ran above,
      # before the fetch, which is the correct place for them.
      - name: Commit refreshed data
        run: |
          git config user.name "hredd-pipeline"
          git config user.email "pipeline@hredd.org"
          git add public/data/trade-exposure.json public/data/trade-exposure.csv
          if ! git diff --cached --quiet; then
            git commit -m "Data: annual trade exposure refresh [automated]"
            # Rebase before pushing: the pipeline runs for minutes, and any push
            # to main during that window otherwise makes this push rejected as
            # non-fast-forward, discarding the freshly fetched data. The data
            # files are only ever written by this workflow, so the rebase
            # cannot conflict.
            git pull --rebase origin main
            git push
          fi
